# ══════════════════════════════════════════════════════════════════════════════
#  JitPlus — Cloud Build CI/CD Pipeline
#  Déployé sur : Cloud Run (backend) + Cloud SQL + Cloud Storage + Secret Manager
#
#  Prérequis :
#    1. Artifact Registry repo créé : gcloud artifacts repositories create jitplus \
#         --repository-format=docker --location=europe-west1
#    2. Cloud SQL instance PostgreSQL créée
#    3. Secrets créés dans Secret Manager (voir liste ci-dessous)
#    4. Compte de service Cloud Build avec les rôles :
#         - Cloud Run Admin
#         - Cloud SQL Client
#         - Artifact Registry Writer
#         - Secret Manager Secret Accessor
#
#  Secrets requis dans Secret Manager (créer avec gcloud secrets create) :
#    - DATABASE_URL
#    - JWT_SECRET
#    - QR_HMAC_SECRET
#    - SENTRY_DSN
#    - CORS_ORIGINS
#    - BACKEND_URL
#    - FIREBASE_CLIENT_EMAIL
#    - FIREBASE_PRIVATE_KEY
#    - GOOGLE_CLIENT_ID
#    - RESEND_API_KEY
#    - SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_FROM
#
#  Variables de substitution à personnaliser :
#    _REGION, _SERVICE_NAME, _CLOUD_SQL_INSTANCE, _AR_REPO
# ══════════════════════════════════════════════════════════════════════════════

substitutions:
  _REGION: europe-west9
  _SERVICE_NAME: jitplus-api
  _AR_REPO: jitplus
  _CLOUD_SQL_INSTANCE: jitplus-97259:europe-west9:jitplus-db
  _IMAGE: ${_REGION}-docker.pkg.dev/jitplus-97259/${_AR_REPO}/backend
  # Mobile force-update gate (GET /health/version). Builds that do not send
  # ?app= (JitPlus < 1.4.0, JitPlus Pro < 1.6.0) read the legacy pair.
  _MIN_VERSION_LEGACY: '1.6.0'
  _MIN_VERSION_JITPLUS: '1.4.0'
  _MIN_VERSION_JITPLUSPRO: '1.6.0'
  # Override with --substitutions=_MAINTENANCE_MODE=true for a deploy that must
  # come up in maintenance (see docs/deploiement-tampons-uniquement.md).
  _MAINTENANCE_MODE: 'false'
  # /geocode/* (paid Google APIs) requires a merchant token once 'true'. Keep
  # 'false' until JitPlus Pro builds without the token are gone (raise
  # _MIN_VERSION_JITPLUSPRO to the first build that sends it, then flip).
  _GEOCODE_REQUIRE_AUTH: 'false'

steps:
  # ── 1. Build the Docker image ───────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --pull
      - --tag=$_IMAGE:$COMMIT_SHA
      - --tag=$_IMAGE:latest
      - --cache-from=$_IMAGE:latest
      - --file=apps/backend/Dockerfile
      - .
    waitFor: ['-']

  # ── 2. Push the image to Artifact Registry ──────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - $_IMAGE
    waitFor: [build]

  # ── 3-pre. Free database connections held by old revisions ─────────────────
  #  A revision that no longer receives traffic keeps running while its
  #  websockets stay open (--timeout=3600), with its Postgres pool and crons.
  #  Two or three of them at once exhausted Cloud SQL connections after the
  #  2026-11-13 deploy, and a new revision could not even start. Delete the
  #  recent revisions that serve no traffic before migrating and deploying.
  #  Never touches a serving revision; any failure only logs and continues.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: cleanup-stale-revisions
    entrypoint: bash
    args:
      - -c
      - |
        SERVING=$$(gcloud run services describe $_SERVICE_NAME --region=$_REGION \
          --format='value(status.traffic.revisionName)' | tr ';,' '\n\n' | sed '/^$$/d')
        if [ -z "$$SERVING" ]; then echo "No serving revision found — skipping cleanup"; exit 0; fi
        echo "Serving: $$SERVING"
        for REV in $$(gcloud run revisions list --service=$_SERVICE_NAME --region=$_REGION \
            --sort-by=~metadata.creationTimestamp --limit=8 --format='value(metadata.name)'); do
          if echo "$$SERVING" | grep -qx "$$REV"; then continue; fi
          echo "Deleting stale revision $$REV"
          gcloud run revisions delete "$$REV" --region=$_REGION --quiet || echo "Could not delete $$REV — continuing"
        done
    waitFor: [push]

  # ── 3. Run database migrations (Cloud Run Job — one-off) ───────────────────
  #  Crée ou met à jour un Cloud Run Job "jitplus-migrate" puis l'exécute.
  #  Le job utilise l'entrypoint.sh avec SKIP_MIGRATIONS=0 pour lancer migrate deploy.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-migrate-job
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - jitplus-migrate
      - --image=$_IMAGE:$COMMIT_SHA
      - --region=$_REGION
      - --set-cloudsql-instances=$_CLOUD_SQL_INSTANCE
      - --set-env-vars=NODE_ENV=production,SKIP_MIGRATIONS=0,GCP_PROJECT_ID=${PROJECT_ID},GCP_STORAGE_BUCKET_NAME=jitplus-uploads-prod
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,DIRECT_DATABASE_URL=DATABASE_URL:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest
      - --command=/app/docker-entrypoint.sh
      - --args=echo,migrations-complete
      - --task-timeout=300s
      - --max-retries=0
    waitFor: [cleanup-stale-revisions]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: run-migrations
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - jitplus-migrate
      - --region=$_REGION
      - --wait
    waitFor: [deploy-migrate-job]

  # ── 4. Deploy the Cloud Run service ─────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-service
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_IMAGE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      # The @Cron jobs (purges, digests, reminders, scratch dispatch) are
      # in-process timers: with min-instances=0 Cloud Run scales to zero when
      # idle and they never fire; with request-based CPU they fire late or
      # not at all between requests. Keep one warm instance with CPU always
      # allocated. cron_runs (CronRunLock) still makes each slot run once
      # when several instances are up.
      - --min-instances=1
      - --no-cpu-throttling
      - --max-instances=3
      # WebSocket connections are idle 99% of the time; pack many per instance
      # so far fewer instances are needed (major Cloud Run cost saver).
      - --concurrency=400
      - --memory=512Mi
      - --cpu=1
      - --cpu-boost
      - --execution-environment=gen2
      # Socket.IO requires session affinity (sticky sessions) so the WS handshake
      # and subsequent frames are routed to the same instance. Without it,
      # Cloud Run's load balancer randomly distributes packets → 400 on handshake.
      - --session-affinity
      # Extend request timeout to 1h to keep long-lived WebSocket connections alive.
      - --timeout=3600
      - --set-cloudsql-instances=$_CLOUD_SQL_INSTANCE
      - --set-env-vars=^;;^NODE_ENV=production;;ENABLE_CRONS=true;;DATABASE_POOL_SIZE=5;;SKIP_MIGRATIONS=1;;GCP_PROJECT_ID=${PROJECT_ID};;GCP_STORAGE_BUCKET_NAME=jitplus-uploads-prod;;FIREBASE_PROJECT_ID=jitplus-97259;;MODERATION_EMAIL=contact@jitplus.com;;SMTP_FROM=contact@jitplus.com;;SMTP_FROM_NAME=JitPlus;;SMTP_REPLY_TO=contact@jitplus.com;;PUBLIC_WEB_URL=https://jitplus.com;;GOOGLE_CLIENT_ID=290470991104-71koh2ac0h2ai8tppb5t8bsnmoo9mdtj.apps.googleusercontent.com;;GOOGLE_ANDROID_CLIENT_ID=290470991104-5av1uiocig1l5k2rfq9ehb9ui5vb9oj9.apps.googleusercontent.com,290470991104-rcumid1oof1j80luvo62n05rc7or4ve9.apps.googleusercontent.com;;ANDROID_SHA256_FINGERPRINT=26:6C:F3:12:5F:51:32:2A:03:A8:FD:26:F2:A5:92:02:48:61:F8:B7:03:1B:B7:DB:92:CA:AE:2C:78:8E:8C:1B;;ANDROID_PRO_SHA256_FINGERPRINT=54:55:81:CB:46:7F:D1:B7:8E:26:88:89:EA:C9:F7:3C:A1:04:F5:82:BC:D2:1E:FE:B3:3D:F8:3C:9D:34:BE:F4;;APPLE_TEAM_ID=53X2DQJH29;;APPLE_BUNDLE_IDS=com.jitplus.client,com.jitplus.pro;;IOS_APP_ID=6762307929;;IOS_PRO_APP_ID=6762308251;;MAINTENANCE_MODE=${_MAINTENANCE_MODE};;GEOCODE_REQUIRE_AUTH=${_GEOCODE_REQUIRE_AUTH};;MIN_IOS_VERSION=${_MIN_VERSION_LEGACY};;MIN_ANDROID_VERSION=${_MIN_VERSION_LEGACY};;MIN_IOS_VERSION_JITPLUS=${_MIN_VERSION_JITPLUS};;MIN_ANDROID_VERSION_JITPLUS=${_MIN_VERSION_JITPLUS};;MIN_IOS_VERSION_JITPLUSPRO=${_MIN_VERSION_JITPLUSPRO};;MIN_ANDROID_VERSION_JITPLUSPRO=${_MIN_VERSION_JITPLUSPRO}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,QR_HMAC_SECRET=QR_HMAC_SECRET:latest,SENTRY_DSN=SENTRY_DSN:latest,CORS_ORIGINS=CORS_ORIGINS:latest,BACKEND_URL=BACKEND_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest
    waitFor: [run-migrations]

images:
  - $_IMAGE:$COMMIT_SHA
  - $_IMAGE:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
