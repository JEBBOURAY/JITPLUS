<!doctype html>
<html><head><meta charset="utf-8"><title>JitPlus store</title>
<style>
@font-face{font-family:Lexend;src:url(fonts/Lexend_400Regular.ttf);font-weight:400}
@font-face{font-family:Lexend;src:url(fonts/Lexend_500Medium.ttf);font-weight:500}

@font-face{font-family:Lexend;src:url(fonts/Lexend_700Bold.ttf);font-weight:700}
@font-face{font-family:Lexend;src:url(fonts/Lexend_800ExtraBold.ttf);font-weight:800}
@font-face{font-family:Cairo;src:url(fonts/Cairo_400Regular.ttf);font-weight:400}
@font-face{font-family:Cairo;src:url(fonts/Cairo_500Medium.ttf);font-weight:500}

*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#2E1065}
body{font-family:Lexend,'Segoe UI Emoji',sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased}
body.ar{font-family:Cairo,'Segoe UI Emoji',sans-serif}
.ic{display:block;flex-shrink:0}

/* canvas */
#canvas{position:relative;overflow:hidden;background:linear-gradient(165deg,#2A0E5C 0%,#4C1D95 42%,#6D28D9 100%)}
.bgpat{position:absolute;inset:0}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.55) 0%,rgba(124,58,237,.18) 45%,rgba(124,58,237,0) 70%)}
.gstar{position:absolute;filter:drop-shadow(0 0 6px rgba(251,191,36,.6))}
.head{position:absolute;left:0;right:0;text-align:center;color:#fff;padding:0 28px}
.orn{display:flex;justify-content:center;margin-bottom:12px}
.head h1{font-weight:700;font-size:36px;line-height:1.14;letter-spacing:-.8px}
.ar .head h1{font-weight:800;font-size:38px;line-height:1.3;letter-spacing:0}
.gold{background:linear-gradient(90deg,#FDE68A,#FBBF24 45%,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{margin-top:10px;font-size:17px;font-weight:500;color:rgba(237,233,254,.82)}
.android .head h1{font-size:27px}.ar.android .head h1{font-size:29px}
.android .head p{font-size:13px;margin-top:7px}
.ar.android .head{top:16px!important}.ar.android .head h1{font-size:26px;line-height:1.22}.ar.android .head p{margin-top:3px}.ar.android .orn{margin-bottom:4px}.android .orn{margin-bottom:8px}.android .orn svg{width:96px;height:14px}

.phone{position:absolute;background:linear-gradient(145deg,#3B3B46,#121218 40%,#26262E);box-shadow:0 0 0 1.5px #55556A inset,0 0 0 1px #0A0A0E,0 30px 60px rgba(14,4,40,.55),0 10px 22px rgba(14,4,40,.35)}
.phone.android{background:#15151B}
.screenwrap{overflow:hidden;position:relative;background:#fff}
.toast{position:absolute;z-index:5;display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 14px 10px 10px;box-shadow:0 14px 30px rgba(20,6,50,.35);min-width:150px}
[dir=rtl] .toast{padding:10px 10px 10px 14px}
.toast b{display:block;font-size:14px;font-weight:700;color:#0F172A}.toast span{display:block;font-size:11px;color:#64748B;font-weight:500;margin-top:1px}
.tck{width:36px;height:36px;border-radius:12px;background:#10B981;display:flex;align-items:center;justify-content:center}
.tck.g{background:linear-gradient(135deg,#FBBF24,#F59E0B)}
.android .toast{transform:scale(.8);transform-origin:center}

/* screen base */
.scr{position:relative;width:393px;height:852px;overflow:hidden;background:#fff;color:#0F172A}
.sb{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;z-index:60;direction:ltr;font-family:'Segoe UI',system-ui,sans-serif}
.sb.ios{height:54px;padding:6px 30px 0 52px;font-weight:600;font-size:17px}
.sb.and{height:36px;padding:0 20px;font-weight:500;font-size:14px}
.sbi{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;margin-left:-62px;width:124px;height:36px;border-radius:20px;background:#000;z-index:61}
.punch{position:absolute;top:11px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:#000;z-index:61}
.homeind{position:absolute;bottom:8px;left:50%;z-index:70;border-radius:3px}
.homeind.ios{width:134px;height:5px;margin-left:-67px}
.homeind.android{width:108px;height:4px;margin-left:-54px;opacity:.55;bottom:7px}

.hdr{display:flex;align-items:center;padding:0 20px 12px;min-height:46px;position:relative}
.hdr.col{display:block;border-bottom:.5px solid rgba(0,0,0,.08);padding-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:#7C3AED14;border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#7C3AED;font-weight:700;font-size:15px;letter-spacing:.4px;margin-inline-end:12px;flex-shrink:0}
.ttl{flex:1;min-width:0}
.greet{font-size:15px;font-weight:500;color:#334155;margin-bottom:1px}

.content{padding:6px 16px 0}
.sec{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;padding-top:10px;background:rgba(255,255,255,.97);border-top:.5px solid rgba(0,0,0,.06);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(15,23,42,.06);z-index:40}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tic{width:46px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;position:relative}
.tic.on{background:#7C3AED15}
.tind{position:absolute;top:-10px;width:24px;height:3px;border-radius:2px;background:#7C3AED}
.tl{font-size:10px;letter-spacing:.3px;color:#64748B;font-weight:500;line-height:13px}
.tl.on{color:#7C3AED;font-weight:700}
.ar .tl{letter-spacing:0;font-size:10.5px}
.qrbtn{width:48px;height:48px;border-radius:24px;margin-top:-12px;margin-bottom:-2px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7C3AED20,#5B21B620);box-shadow:0 4px 12px rgba(124,58,237,.08)}
.qrbtn.on{background:linear-gradient(135deg,#7C3AED,#5B21B6);box-shadow:0 4px 12px rgba(124,58,237,.35)}
.nbadge{position:absolute;top:-4px;right:2px;min-width:18px;height:18px;border-radius:9px;padding:0 4px;background:#EF4444;border:1.5px solid #fff;color:#fff;font-size:9px;font-weight:700;line-height:15px;text-align:center;font-family:Lexend}

/* cards screen */
.tiles{display:flex;gap:12px;margin-bottom:14px}
.tile{flex:1;height:156px;border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;color:#fff}

.ttop{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.tart{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center}

.tcount{min-width:34px;height:34px;border-radius:17px;padding:0 8px;background:#fff;box-shadow:0 3px 6px rgba(0,0,0,.18);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Lexend}
.ttitle{font-size:13px;font-weight:700;letter-spacing:-.2px}
.tsub{font-size:11px;font-weight:500;color:rgba(255,255,255,.85);margin-top:1px}
.tcta{align-self:flex-start;background:#fff;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 0}
.toolbar .sec{margin:0}
.tbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.carousel{position:relative;height:242px;margin:0 -16px;perspective:900px}
.wc{position:absolute;top:14px;left:39.5px;width:314px;height:198px;border-radius:24px;box-shadow:0 14px 22px color-mix(in srgb,var(--sh) 35%,transparent)}
.wc.center{z-index:3}
.wc.left{transform:translateX(-182px) translateY(6px) scale(.8) rotateY(24deg);opacity:.9;z-index:1}
.wc.right{transform:translateX(182px) translateY(6px) scale(.8) rotateY(-24deg);opacity:.9;z-index:1}
.wcin{position:absolute;inset:0;border-radius:24px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}

.orbA,.orbB,.dim{position:absolute;border-radius:50%}

.orbB{width:139px;height:139px;bottom:-69px;left:-38px;background:rgba(255,255,255,.06)}
.dim{inset:0;border-radius:24px;background:rgba(15,23,42,.22)}
.wch{display:flex;align-items:center;position:relative}
.mlogo{background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wct{flex:1;margin:0 10px;min-width:0}
.wcn{font-size:15px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcc{font-size:11px;font-weight:500;color:rgba(255,255,255,.78);margin-top:1px}
.cnt{display:flex;align-items:baseline;font-family:Lexend}.cnt b{font-size:20px;letter-spacing:-.6px}.cnt span{font-size:11px;font-weight:500;color:rgba(255,255,255,.78)}
[dir=rtl] .cnt{direction:ltr}
.readypill{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:linear-gradient(90deg,#FBBF24,#F59E0B);font-size:11px;font-weight:700}
.stamps{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.stamps>div{display:flex;gap:6px}
.stamp{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);display:flex;align-items:center;justify-content:center}

.stamp i{width:62%;height:62%;-webkit-mask:url(img/logo.png) center/contain no-repeat;mask:url(img/logo.png) center/contain no-repeat}

.wcf span:last-child{font-weight:500}
.pager{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:-10px}
.dots{display:flex;gap:6px;align-items:center}.dots i{width:6px;height:6px;border-radius:3px;background:#0F172A;opacity:.25}.dots i.on{width:16px;opacity:1}
.hint{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:#64748B}

/* QR */
.qrcard{position:relative;border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;overflow:hidden;background:linear-gradient(135deg,#4C1D95,#5B21B6,#7C3AED);box-shadow:0 12px 24px rgba(91,33,182,.3)}
.qo1,.qo2{position:absolute;border-radius:50%}
.qo1{width:220px;height:220px;top:-90px;right:-70px;background:rgba(255,255,255,.08)}
.qo2{width:160px;height:160px;bottom:-70px;left:-50px;background:rgba(251,191,36,.14)}
.qtop{align-self:stretch;display:flex;gap:12px;align-items:center;margin-bottom:18px;position:relative}
.qlogo{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center}.qlogo img{width:34px;height:34px;object-fit:contain}
.qlabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.72)}
.ar .qlabel{letter-spacing:0}
.qname{font-size:17px;font-weight:700;color:#fff;margin-top:2px;letter-spacing:-.2px}
.qpanel{background:#fff;border-radius:20px;padding:14px;position:relative}.qpanel svg{display:block}
.qstatus{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:11px;font-weight:500;color:rgba(255,255,255,.85);position:relative}
.qbar{align-self:stretch;margin:10px 24px 0;height:3px;border-radius:2px;background:rgba(255,255,255,.16);position:relative}.qbar i{position:absolute;inset-block:0;inset-inline-start:0;width:66%;border-radius:2px;background:#FBBF24}
.bright{margin:14px auto 0;width:max-content;display:flex;align-items:center;gap:6px;background:#FEF3C7;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;color:#D97706}
.howcard{margin-top:14px;border:1px solid rgba(0,0,0,.08);border-radius:20px;padding:16px}
.howt{font-size:15px;font-weight:700;letter-spacing:-.2px;margin-bottom:14px}
.steps{display:flex;gap:8px}.step{flex:1;display:flex;flex-direction:column;align-items:center}
.sicon{width:46px;height:46px;border-radius:16px;background:#7C3AED12;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:8px}
.snum{position:absolute;top:-5px;inset-inline-end:-5px;width:19px;height:19px;border-radius:10px;background:#7C3AED;border:2px solid #fff;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Lexend}
.slabel{font-size:11px;font-weight:500;color:#334155;text-align:center;line-height:15px}

/* discover */
.map{position:absolute;inset:0}.map>svg{position:absolute;inset:0}
.map text{font-family:inherit}
.pin{position:absolute;width:30px;height:30px;border-radius:6px;background:#fff;border:1px solid #7C3AED;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(76,29,149,.18)}
.pin img{width:20px;height:20px;object-fit:contain}
.pin i{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:#EF4444;border:2px solid #fff}
.pin.sel{transform:scale(1.35);border-width:2px;box-shadow:0 6px 14px rgba(124,58,237,.35);z-index:3}
.cluster{position:absolute;width:34px;height:34px;border-radius:6px;background:#7C3AED;border:1px solid #fff;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:Lexend;box-shadow:0 2px 6px rgba(76,29,149,.25)}
.me{position:absolute;width:16px;height:16px;border-radius:50%;background:#7C3AED;border:3px solid #fff;box-shadow:0 0 0 14px rgba(124,58,237,.14),0 2px 6px rgba(0,0,0,.2)}
.dtop{position:absolute;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.circ{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid rgba(124,58,237,.06);box-shadow:0 3px 16px rgba(124,58,237,.10);display:flex;align-items:center;justify-content:center}
.circ.on{background:#7C3AED}
.cpill{display:flex;align-items:center;gap:6px;background:#fff;padding:10px 16px;border-radius:24px;box-shadow:0 3px 16px rgba(124,58,237,.10);font-size:13px;font-weight:700}
.mchips{position:absolute;left:0;right:0;display:flex;gap:6px;padding:4px 16px;z-index:20;overflow:hidden}
.mchip{display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:20px;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 8px rgba(0,0,0,.04);font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
.mchip.on{background:#7C3AED;border-color:#7C3AED;color:#fff}
.locate{position:absolute;inset-inline-end:16px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 3px 16px rgba(124,58,237,.14);display:flex;align-items:center;justify-content:center;z-index:20}
.callout{position:absolute;left:16px;right:16px;display:flex;align-items:center;background:#fff;border-radius:22px;padding:14px;border:1px solid rgba(124,58,237,.08);box-shadow:0 6px 24px rgba(124,58,237,.16);overflow:hidden;z-index:20}
.cbar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:#7C3AED}
.cav{width:56px;height:56px;border-radius:16px;background:#0F766E14;display:flex;align-items:center;justify-content:center;margin-inline-end:12px;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-size:17px;font-weight:700;letter-spacing:-.3px}

.cact{display:flex;flex-direction:column;align-items:center;gap:8px;margin-inline-start:8px}
.cnav{width:42px;height:42px;border-radius:14px;background:#7C3AED;display:flex;align-items:center;justify-content:center}

/* merchant */
.cover{position:absolute;top:0;left:0;right:0;background:#F7F8FA;overflow:hidden}
